[package]
name = "wtx"
version = "0.9.0"
edition = "2021"
authors = ["Raku Sakaguchi <rakutek12@gmail.com>"]
description = "Per-worktree microVMs with isolated Docker runtimes for parallel coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rakutek/wtx"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
sha2 = "0.10"
ratatui = "0.29"
unicode-width = "0.2"
crossterm = "0.28"
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
