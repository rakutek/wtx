[package]
name = "wtx"
version = "0.6.0"
edition = "2021"
authors = ["Raku Sakaguchi <rakutek12@gmail.com>"]
description = "worktree×コーディングエージェント並列開発ツール: worktreeごとの独立VM (Lima/vz) + VM内dockerd、--fromでDB・イメージごと環境を引き継ぐ"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rakutek/wtx"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
ratatui = "0.29"
unicode-width = "0.2"
crossterm = "0.28"
dirs = "6"
libc = "0.2"

[profile.release]
strip = true
